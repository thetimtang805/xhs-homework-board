name: Deploy to GitHub Pages

# 合并到 main 后自动发布；也可以在 Actions 页手动运行。
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选 GitHub Actions。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 组装站点（首页 = 完整流程）
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' --exclude 'oilreview' --exclude 'docs' --exclude 'tools' ./ _site/
          [ -f _site/index.html ] && mv _site/index.html _site/prototype-old.html
          cp flow.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
