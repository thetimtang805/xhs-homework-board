<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>视频播放页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* tokens：rednote-ds 设计系统里能对上的变量；其余取自设计稿取样（该节点是整屏截图，没有图层和变量） */
:root{
  --color-text-inverse:#ffffff;
  --color-text-accent:#ff2442;
  --color-icon-accent:#ff2442;
  --space-xl:16px;
  --radius-pill:999px;
  --font-zh:"Noto Sans SC","PingFang SC",sans-serif;
  --font-en:"SF Pro","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans SC",sans-serif;
  /* 取样色 */
  --v-star:#fbbc53;
  --v-input:#2c2c2c;
  --v-input-text:#717171;
  --v-bar:#000000;
  --stage:#2a2a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);display:flex;align-items:center;justify-content:center;font-family:var(--font-zh)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{display:block;overflow:visible}
p{font-weight:400}
.en{font-family:var(--font-en)}

/* ===== 375×812：窄屏铺满，宽屏居中 ===== */
.page{position:relative;width:375px;height:812px;overflow:hidden;background:#000;color:var(--color-text-inverse)}
@media (max-width:375px){body{display:block}.page{width:100vw;height:100dvh}}

/* ===== 视频画面：用色块代替截图（0–737） ===== */
.video{position:absolute;left:0;top:0;width:100%;height:737px;overflow:hidden;background:#c9c3b2}
.video i{position:absolute;display:block}
.v-wall{left:0;top:0;width:100%;height:330px;background:#cfcabb}
.v-pan{left:36px;top:-85px;width:458px;height:360px;border-radius:50%;background:#171311}
.v-handle{left:-10px;top:118px;width:50px;height:32px;border-radius:8px;background:#8d8c89}
.v-board{left:0;top:380px;width:375px;height:254px;background:#caa475;clip-path:polygon(0 0,100% 0,100% 38.6%,56% 100%,0 52%)}
.v-cake{left:-6px;top:208px;width:386px;height:300px;border-radius:50%;background:#c27c33;transform:rotate(-9deg)}
.v-cake::after{content:"";position:absolute;left:26px;top:30px;right:26px;bottom:34px;border-radius:50%;background:#9f6a3f}
.v-floor{left:0;top:600px;width:100%;height:137px;background:#d0cec5}

/* ===== 状态栏（深色，白字） ===== */
.status{position:absolute;left:0;top:0;width:100%;height:44px;z-index:5;pointer-events:none}
.status .time{position:absolute;left:38.8px;top:14px;font-family:var(--font-en);font-weight:600;font-size:16px;line-height:22px;letter-spacing:.1px;font-variant-numeric:tabular-nums;color:#fff}
.status .sig{position:absolute;left:275px;top:19px}
.status .wifi{position:absolute;left:300px;top:19.5px}
.status .bat{position:absolute;left:323px;top:19px;width:26px;height:12px;border-radius:4px;background:linear-gradient(to right,#fff 0 64%,rgba(255,255,255,.4) 64% 100%);display:flex;align-items:center;justify-content:center;font-family:var(--font-en);font-weight:700;font-size:11.5px;line-height:12px;color:#000}
.status .bat::after{content:"";position:absolute;right:-3px;top:4px;width:1.6px;height:4px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.4)}

/* ===== 顶部导航：返回 / 小程序 / 搜索 / 分享 ===== */
.nav button{position:absolute;z-index:5;padding:0;display:grid;place-items:center}
.nav button::before{content:"";position:absolute;inset:-9px}
.nav .back{left:16px;top:60px;width:16px;height:26px}
.nav .mini{left:55px;top:61px;width:20px;height:24px}
.nav .search{left:293px;top:62px;width:22px;height:22px}
.nav .share{left:333px;top:62px;width:26px;height:22px}
.nav svg{pointer-events:none}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px}

/* ===== 字幕 ===== */
.subs{position:absolute;left:0;right:0;top:516px;text-align:center;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.45);pointer-events:none}
.subs .cn{font-size:19.2px;line-height:24px;color:#fff;font-weight:400}
.subs .enl{font-family:var(--font-en);font-size:18.5px;line-height:22px;letter-spacing:.3px;color:#fff;margin-top:2px;white-space:nowrap}

/* ===== 信息区 ===== */
.chip{position:absolute;left:15.5px;top:598px;height:25px;width:158.6px;display:flex;align-items:center;padding:0 10px 0 9px;border-radius:var(--radius-pill);background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);z-index:3;white-space:nowrap}
.chip .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--color-text-accent)}
.chip .red{flex:none;margin-left:0;font-family:var(--font-en);font-weight:800;font-size:14px;line-height:25px;letter-spacing:-.2px;color:var(--color-text-accent);transform:translateY(.5px)}
.chip .t1{margin-left:5px;font-size:12px;letter-spacing:.2px;font-weight:700;line-height:23px;color:#fff;position:relative;top:-1px}
.chip .sep{flex:none;width:.5px;height:9px;margin:0 7px;background:rgba(255,255,255,.4)}
.chip .t2{font-size:12px;line-height:25px;color:rgba(255,255,255,.72)}
.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}

.author{position:absolute;left:15.5px;top:631px;display:flex;align-items:center;z-index:3}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5px rgba(255,255,255,.7);background:linear-gradient(#b98a62 0 42%,#e3e0dd 42% 100%)}
.author .name{margin-left:9px;font-size:15px;font-weight:500;line-height:20px;color:#fff;white-space:nowrap}
.follow{position:absolute;left:127px;top:636px;width:47.7px;height:25px;border-radius:var(--radius-pill);background:var(--color-text-accent);display:grid;place-items:center;font-size:12px;font-weight:500;line-height:22.4px;color:#fff;z-index:3}
.follow:focus-visible{outline:2px solid #fff;outline-offset:2px}
.duration{position:absolute;right:16px;top:639px;font-family:var(--font-en);font-size:14px;line-height:18px;color:rgba(255,255,255,.55);z-index:3}

.desc{position:absolute;left:16px;right:16px;top:674.1px;font-size:13.4px;line-height:18px;color:#fff;white-space:nowrap;z-index:3;text-align:left;padding:0;display:flex;justify-content:space-between}
.desc .more{color:rgba(255,255,255,.55)}

.live{position:absolute;left:15.5px;top:702px;width:187.6px;height:25px;display:flex;align-items:center;padding:0 9px 0 7px;border-radius:8px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28);z-index:3;white-space:nowrap}
.live svg{flex:none}
.live .t1{margin-left:6px;font-family:var(--font-en);font-size:12.8px;line-height:25px;color:#fff;position:relative;top:1.6px}
.live .sep{flex:none;width:.5px;height:9px;margin:0 6px 0 5.5px;background:rgba(255,255,255,.4)}
.live .t2{font-size:12px;line-height:25px;color:#fff}
.live:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ===== 进度条 ===== */
.progress{position:absolute;left:15.4px;right:16px;top:734.3px;height:2.5px;background:rgba(255,255,255,.35);z-index:3;pointer-events:none}
.progress::before{content:"";position:absolute;left:-1.5px;top:-1px;width:4.6px;height:4.6px;border-radius:50%;background:#fff}

/* ===== 底部操作栏（737–812） ===== */
.bar{position:absolute;left:0;right:0;top:737px;bottom:0;background:var(--v-bar);z-index:4}
.input{position:absolute;left:14.4px;top:9.6px;width:127.6px;height:32px;border-radius:var(--radius-pill);background:var(--v-input);display:flex;align-items:center;padding:0 0 0 15px;color:var(--v-input-text);font-size:13.4px;line-height:20px;white-space:nowrap}
.input svg{flex:none}
.input span{margin-left:7.4px;position:relative;top:-1px}
.input svg{position:relative;top:-1px}
.act{position:absolute;top:12.4px;height:25px;display:flex;align-items:center;padding:0}
.act svg{flex:none}
.act span{margin-left:6px;font-family:var(--font-en);font-weight:500;font-size:14px;line-height:20px;color:#fff;white-space:nowrap;position:relative;top:2.4px}
.act.like{left:152.9px}.act.star{left:229.4px}.act.cmt{left:305.4px}
.act.star svg{position:relative;top:1.9px}
.act.cmt svg{position:relative;top:.9px}
.act:focus-visible,.input:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
<div class="page" id="page">

  <!-- 视频画面：色块 -->
  <div class="video" aria-hidden="true">
    <i class="v-wall"></i><i class="v-floor"></i><i class="v-board"></i><i class="v-cake"></i><i class="v-pan"></i><i class="v-handle"></i>
  </div>

  <!-- 状态栏 -->
  <div class="status" aria-hidden="true">
    <div class="time">09:58</div>
    <svg class="sig" width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7.5" width="3.6" height="4.5" rx="1.2" fill="#fff"/><rect x="4.8" y="5" width="3.6" height="7" rx="1.2" fill="#fff"/><rect x="9.6" y="2.4" width="3.6" height="9.6" rx="1.2" fill="#fff" fill-opacity=".38"/><rect x="14.4" y="0" width="3.6" height="12" rx="1.2" fill="#fff" fill-opacity=".38"/></svg>
    <svg class="wifi" width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6Z" fill="#fff"/><path d="M4.9 7.4a4.4 4.4 0 0 1 6.2 0M2.5 4.9a7.8 7.8 0 0 1 11 0M.4 2.5a10.8 10.8 0 0 1 15.2 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
    <div class="bat">64</div>
  </div>

  <!-- 顶部导航 -->
  <nav class="nav" aria-label="顶部导航">
    <button class="back" id="v-back" aria-label="返回"><svg width="10" height="21" viewBox="0 0 10 21" fill="none"><path d="M9 1.2 1.4 10.5 9 19.8" stroke="#fff" stroke-opacity=".8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="mini" id="v-mini" aria-label="小程序"><svg width="19" height="22" viewBox="0 0 19 22" fill="none"><path d="M17.2 11.6V4.4A3.4 3.4 0 0 0 13.8 1H4.4A3.4 3.4 0 0 0 1 4.4v13.2A3.4 3.4 0 0 0 4.4 21H10.4" stroke="#fff" stroke-opacity=".62" stroke-width="1.7" stroke-linecap="round"/><rect x="10.7" y="12" width="7.5" height="9" rx="2.2" stroke="#fff" stroke-opacity=".62" stroke-width="1.7"/></svg></button>
    <button class="search" id="v-search" aria-label="搜索"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8.3" cy="8.3" r="7.2" stroke="#fff" stroke-opacity=".62" stroke-width="1.7"/><path d="m13.7 13.7 5 5" stroke="#fff" stroke-opacity=".62" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <button class="share" id="v-share" aria-label="分享"><svg width="24" height="20" viewBox="0 0 24 20" fill="none"><path d="M23 7.6 15.6 1.2v3.9C8.4 5.4 3.2 9.6 1 17.8c3.2-3.4 7.7-5.2 14.6-5.1v4.1L23 10.4a1.7 1.7 0 0 0 0-2.8Z" stroke="#fff" stroke-opacity=".62" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
  </nav>

  <!-- 字幕 -->
  <div class="subs" aria-live="off">
    <p class="cn">酱香饼好不好吃啊</p>
    <p class="enl">Is the sauce flavored cake delicious</p>
  </div>

  <!-- 精选视频条 -->
  <button class="chip" id="v-chip" aria-label="精选视频，去看看">
    <span class="dot"></span><span class="red">RED</span><span class="t1">精选视频</span><span class="sep"></span><span class="t2">去看看</span>
  </button>

  <!-- 作者行 -->
  <div class="author"><div class="avatar" aria-hidden="true"></div><p class="name">曼食慢语</p></div>
  <button class="follow" id="v-follow">关注</button>
  <p class="duration">2:26</p>

  <!-- 简介 -->
  <button class="desc" id="v-desc"><span>酱香饼好吃的灵魂密码，是把每道缝都刷满酱 买路...</span><span class="more">展开</span></button>

  <!-- 直播预约 -->
  <button class="live" id="v-live" aria-label="10月23日13:00 直播，预约">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.4 4.2c0-1.6 1.1-2.7 2.7-2.7h5.8c1.6 0 2.7 1.1 2.7 2.7v2.2H1.4V4.2Z" fill="#fff" fill-opacity=".85"/><path d="M1.4 7.2h6.1a4.2 4.2 0 0 0-1.2 5.3H4.1c-1.6 0-2.7-1.1-2.7-2.7V7.2Z" fill="#fff" fill-opacity=".85"/><circle cx="10.2" cy="10.2" r="3.1" fill="#fff" fill-opacity=".85" stroke="#8f8c80" stroke-width=".9"/><path d="M10.2 8.5v1.9l1.2.7" stroke="#8f8c80" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="t1">10月23日13:00 直播</span><span class="sep"></span><span class="t2">预约</span>
  </button>

  <!-- 进度条 -->
  <div class="progress" role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

  <!-- 底部操作栏 -->
  <footer class="bar">
    <button class="input" id="v-input"><svg width="14.2" height="14.2" viewBox="0 0 13 13" fill="none"><path d="M8.3 1.4 11.6 4.7 4.6 11.7H1.3V8.4L8.3 1.4Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M6.4 12.4H12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span>说点什么...</span></button>
    <button class="act like" id="v-like" aria-label="点赞 3.8万"><svg width="26" height="24" viewBox="0 0 24 22"><path d="M12 21.4C5.1 16.1.9 12.3.9 7.4.9 3.9 3.5 1.3 6.8 1.3c2 0 3.8 1 5.2 2.9 1.4-1.9 3.2-2.9 5.2-2.9 3.3 0 5.9 2.6 5.9 6.1 0 4.9-4.2 8.7-11.1 14Z" fill="var(--color-icon-accent)"/></svg><span>3.8万</span></button>
    <button class="act star" id="v-star" aria-label="收藏 4.4万"><svg width="27.9" height="26.7" viewBox="0 0 24 23"><path d="M10.6 1.6a1.6 1.6 0 0 1 2.8 0l2.3 4.7 5.2.8c1.3.2 1.8 1.8.9 2.7l-3.7 3.7.9 5.1c.2 1.3-1.1 2.2-2.3 1.6L12 17.7l-4.7 2.4c-1.2.6-2.5-.3-2.3-1.6l.9-5.1L2.2 9.8c-.9-.9-.4-2.5.9-2.7l5.2-.8 2.3-4.7Z" fill="var(--v-star)"/></svg><span>4.4万</span></button>
    <button class="act cmt" id="v-comment" aria-label="评论 481"><svg width="25.3" height="25.3" viewBox="0 0 24 24" fill="none"><path d="M12 1.6C6 1.6 1.4 5.8 1.4 11c0 2.4 1 4.5 2.6 6.1L3.2 22l4.6-2c1.3.4 2.7.6 4.2.6 6 0 10.6-4.2 10.6-9.6S18 1.6 12 1.6Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="8.3" cy="11" r="1.6" fill="#fff"/><circle cx="15.7" cy="11" r="1.6" fill="#fff"/></svg><span>481</span></button>
  </footer>

</div>

<script>
/* 全部按钮只派发事件，交给宿主处理：video:back / mini / search / share / chip / follow / expand / live / input / like / star / comment */
(function(){
  var page=document.getElementById('page');
  [['v-back','back'],['v-mini','mini'],['v-search','search'],['v-share','share'],['v-chip','chip'],['v-follow','follow'],['v-desc','expand'],['v-live','live'],['v-input','input'],['v-like','like'],['v-star','star'],['v-comment','comment']].forEach(function(p){
    document.getElementById(p[0]).addEventListener('click',function(){ page.dispatchEvent(new CustomEvent('video:'+p[1],{bubbles:true})); });
  });
})();
</script>
</body>
</html>
