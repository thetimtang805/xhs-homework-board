<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>作业榜组件</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 组件库页：左侧目录 + 右侧分组。页面自己的颜色用 --g-* 令牌（明暗两套）；
   组件本身是浅色界面，永远画在固定的「舞台」上，舞台底色可切换。 */
:root{
  --g-bg:#f6f3f2;
  --g-panel:#ffffff;
  --g-ink:#1d1a1a;
  --g-muted:#6f6866;
  --g-faint:#a59e9c;
  --g-line:#e8e2e0;
  --g-accent:#e81e3b;
  --g-accent-soft:#fdeaed;
  --g-code:#efeae8;
  --g-stage:#fff5eb;
  --g-shadow:0 1px 0 rgba(30,10,10,.04),0 6px 20px -12px rgba(60,20,20,.18);
  --g-font:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --g-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --g-bg:#151213;--g-panel:#1e1a1b;--g-ink:#f1ecea;--g-muted:#aaa2a0;--g-faint:#7b7371;--g-line:#2f2a2b;
    --g-accent:#ff5a70;--g-accent-soft:#3a1d23;--g-code:#262122;--g-shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --g-bg:#151213;--g-panel:#1e1a1b;--g-ink:#f1ecea;--g-muted:#aaa2a0;--g-faint:#7b7371;--g-line:#2f2a2b;
  --g-accent:#ff5a70;--g-accent-soft:#3a1d23;--g-code:#262122;--g-shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (min-width:960px){html{scroll-padding-top:24px}}
body{margin:0;background:var(--g-bg);color:var(--g-ink);font-family:var(--g-font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g-accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:minmax(0,1fr);max-width:1320px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
@media (min-width:960px){.shell{grid-template-columns:236px minmax(0,1fr);gap:56px;padding-inline:max(32px,env(safe-area-inset-left,0px)) max(32px,env(safe-area-inset-right,0px))}}

/* 目录 */
.side{position:sticky;top:0;z-index:5;background:var(--g-bg);padding:14px 0 10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--g-line)}
.brand{display:none}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--g-muted);padding:6px 12px;border-radius:999px;border:1px solid var(--g-line);font-size:13px;white-space:nowrap}
.nav a[aria-current="true"]{background:var(--g-ink);color:var(--g-bg);border-color:var(--g-ink)}
.ctrls{display:none}
@media (min-width:960px){
  .side{align-self:start;height:100vh;overflow-y:auto;border:0;margin:0;padding:40px 0 32px;display:flex;flex-direction:column;gap:28px;scrollbar-width:thin}
  .brand{display:block}
  .brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em}
  .brand span{display:block;font:400 11px/1.5 var(--g-mono);color:var(--g-faint);margin-top:2px}
  .nav{flex-direction:column;gap:0;overflow:visible}
  .nav a.grp{font:500 11px/1 var(--g-mono);letter-spacing:.08em;color:var(--g-faint);padding:20px 0 8px 10px;margin-top:6px;border-radius:0}
  .nav a.grp:first-child{margin-top:0;padding-top:0}
  .nav a.grp:hover{background:none;color:var(--g-ink)}
  .nav a.grp[aria-current="true"]{background:none;color:var(--g-accent)}
  .nav a{border:0;border-radius:8px;padding:5px 10px;margin-left:-10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .nav a small{font:400 11px var(--g-mono);color:var(--g-faint)}
  .nav a:hover{background:var(--g-code)}
  .nav a[aria-current="true"]{background:var(--g-accent-soft);color:var(--g-accent)}
  .nav a[aria-current="true"] small{color:inherit}
  .ctrls{display:flex;flex-direction:column;gap:14px;margin-top:auto}
}
.ctrl label{display:block;font:500 11px/1 var(--g-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--g-faint);margin-bottom:8px}
.seg{display:flex;border:1px solid var(--g-line);border-radius:8px;padding:2px;background:var(--g-panel)}
.seg button{flex:1;border:0;background:none;padding:5px 6px;border-radius:6px;font-size:12px;color:var(--g-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--g-ink);color:var(--g-bg)}

/* 页头 */
.hero{padding:44px 0 36px;border-bottom:1px solid var(--g-line)}
.eyebrow{font:500 12px/1 var(--g-mono);letter-spacing:.08em;color:var(--g-accent);text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,44px);line-height:1.15;margin:14px 0 14px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hero p{max-width:60ch;color:var(--g-muted);margin:0;font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 36px;margin-top:26px}
.stats div{display:flex;flex-direction:column}
.stats b{font:500 22px/1.2 var(--g-mono);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--g-muted)}

/* 分组 */
.group{padding-top:56px}
.group>header h2{font-size:24px;line-height:1.25;margin:0;font-weight:700}
.group>header p{margin:6px 0 0;color:var(--g-muted)}
.comp{margin-top:44px;padding-top:28px;border-top:1px solid var(--g-line)}
.comp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.comp-head h3{margin:0;font-size:19px;font-weight:700}
.comp-head code{font:400 12px var(--g-mono);color:var(--g-muted);background:var(--g-code);padding:2px 8px;border-radius:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font:400 12px var(--g-mono);color:var(--g-faint)}
.meta b{font-weight:500;color:var(--g-muted)}
.comp-desc{max-width:62ch;margin:12px 0 0;color:var(--g-muted)}
.props{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 20px;margin:18px 0 0;padding:14px 16px;border:1px solid var(--g-line);border-radius:10px;background:var(--g-panel);font-size:13px}
.props dt{color:var(--g-faint);font:500 12px/1.9 var(--g-mono)}
.props dd{margin:0;color:var(--g-ink);min-width:0}

.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--min,380px)),1fr));gap:18px;margin-top:22px;align-items:start}
.var{display:flex;flex-direction:column;min-width:0;border:1px solid var(--g-line);border-radius:12px;background:var(--g-panel);box-shadow:var(--g-shadow);overflow:hidden}
.var.wide{grid-column:1/-1}
.stage{background:var(--stage-bg,var(--g-stage));padding:22px 20px;display:flex;align-items:center;justify-content:center;min-height:120px;overflow-x:auto}
.stage.start{justify-content:flex-start}
.stage .host{display:block;flex:none}
.cap{padding:11px 16px 13px;border-top:1px solid var(--g-line)}
.cap b{font-size:13px;font-weight:700}
.cap p{margin:2px 0 0;font-size:12px;color:var(--g-muted)}
.frame-wrap{flex:none;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 8px 30px -14px rgba(0,0,0,.4)}
.frame-wrap iframe{position:absolute;left:0;top:0;width:375px;height:812px;border:0;transform-origin:0 0;background:#fff}

/* 设计基础 */
.found{display:grid;gap:36px;margin-top:24px}
.found h3{margin:0 0 12px;font:500 12px/1 var(--g-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--g-faint)}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{border:1px solid var(--g-line);border-radius:10px;overflow:hidden;background:var(--g-panel)}
.sw i{display:block;height:54px;border-bottom:1px solid var(--g-line);background-image:linear-gradient(45deg,#e9e4e2 25%,transparent 25%,transparent 75%,#e9e4e2 75%),linear-gradient(45deg,#e9e4e2 25%,transparent 25%,transparent 75%,#e9e4e2 75%);background-size:10px 10px;background-position:0 0,5px 5px;position:relative}
.sw i::after{content:"";position:absolute;inset:0;background:var(--c)}
.sw span{display:block;padding:8px 10px 0;font:500 12px var(--g-mono)}
.sw em{display:block;padding:0 10px 9px;font:400 11px var(--g-mono);color:var(--g-faint);font-style:normal;text-transform:uppercase}
.rad-row{display:flex;flex-wrap:wrap;gap:14px}
.rad{width:112px;border:1px solid var(--g-line);border-radius:10px;padding:12px;background:var(--g-panel)}
.rad i{display:block;height:56px;background:var(--g-accent-soft);border:2px solid var(--g-accent);border-radius:var(--r)}
.rad span{display:block;margin-top:8px;font:500 12px var(--g-mono)}
.rad em{font:400 11px var(--g-mono);color:var(--g-faint);font-style:normal}
.sp-row{display:flex;flex-direction:column;gap:8px;max-width:520px}
.sp-row div{display:flex;align-items:center;gap:12px;font:400 12px var(--g-mono);color:var(--g-muted)}
.sp-row b{width:46px;color:var(--g-ink);font-weight:500}
.sp-row i{display:block;height:14px;background:var(--g-accent);border-radius:3px;opacity:.85}
.av-row{display:flex;flex-wrap:wrap;gap:8px}
.av-row img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--g-line)}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.type{border:1px solid var(--g-line);border-radius:10px;padding:14px 16px;background:var(--g-panel)}
.type p{margin:0;color:var(--g-ink)}
.type small{display:block;margin-top:6px;font:400 11px var(--g-mono);color:var(--g-faint)}

.foot{margin-top:72px;padding-top:24px;border-top:1px solid var(--g-line);font-size:12px;color:var(--g-faint)}
.foot a{color:var(--g-muted)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b>作业榜组件</b><span>rednote-ds · 375 基准</span></div>
    <nav class="nav" id="nav" aria-label="目录"></nav>
    <div class="ctrls">
      <div class="ctrl"><label>舞台底色</label>
        <div class="seg" id="stageSeg">
          <button type="button" data-v="page" aria-pressed="true">页面底</button>
          <button type="button" data-v="white" aria-pressed="false">白</button>
          <button type="button" data-v="dark" aria-pressed="false">深</button>
        </div></div>
      <div class="ctrl"><label>页面主题</label>
        <div class="seg" id="themeSeg">
          <button type="button" data-v="system" aria-pressed="true">跟随</button>
          <button type="button" data-v="light" aria-pressed="false">浅</button>
          <button type="button" data-v="dark" aria-pressed="false">深</button>
        </div></div>
    </div>
  </aside>

  <main id="main">
    <header class="hero">
      <div class="eyebrow">小红书 · 美食作业榜</div>
      <h1>作业榜组件库</h1>
      <p>把作业榜拆成 9 个组件，按用途分组，每个组件列出可以出现的状态和变体。样式直接取自正在运行的页面，不是截图。</p>
      <div class="stats">
        <div><b>9</b><span>组件</span></div>
        <div><b>35</b><span>变体</span></div>
        <div><b>375 × 812</b><span>设计基准</span></div>
        <div><b>rednote-ds</b><span>Figma 设计系统</span></div>
      </div>
    </header>
    <div id="groups"></div>
    <footer class="foot">组件样式来自 <code>homework-board.html</code> 和 <code>comment-page.html</code>，由 <code>tools/build-gallery.py</code> 生成。昵称、评论和图片均为虚构。</footer>
  </main>
</div>

<script>

    tg.appendChild(el('div','type','<p style="font-size:14px;line-height:20px;font-family:-apple-system,\'SF Pro\',sans-serif">129 · 10-04 · Fusion</p><small>数字与英文 · SF Pro，等宽数字</small>'));
    ty.appendChild(tg);box.appendChild(ty);
    var av=el('section');av.appendChild(el('h3',null,'头像 · 虚拟头像 20 个，一律正圆'));
    var ar=el('div','av-row');
    for(var i=1;i<=20;i++){ar.appendChild(el('img',null)).src='assets/avatars/avatar-'+(i<10?'0':'')+i+'.png';}
    av.appendChild(ar);box.appendChild(av);
    return box;
  }

  /* ---------- 标本 ---------- */
  function placeHL(root){
    var dd=root.querySelector('.dd[data-hl]');if(!dd) return;
    var hls=dd.querySelector('.hls'),body=dd.querySelector('.body');hls.innerHTML='';
    var d=dd.getBoundingClientRect(),b=body.getBoundingClientRect(),lh=20;
    [].forEach.call(body.querySelectorAll('b'),function(bb){
      [].forEach.call(bb.getClientRects(),function(r){
        if(r.width<2) return;
        var line=Math.floor(((r.top+r.height/2)-b.top)/lh),i=document.createElement('i');
        i.style.left=(r.left-d.left)+'px';i.style.top=(b.top-d.top+line*lh+14)+'px';i.style.width=r.width+'px';
        hls.appendChild(i);
      });
    });
  }
  var shadows=[];
  function specimen(v){
    var stage=el('div','stage'+(v.wide?' start':''));
    if(v.stage) stage.style.setProperty('--stage-bg',v.stage);
    if(v.key==='frame'){
      var s=.62,w=Math.round(375*s),h=Math.round(812*s);
      var wrap=el('div','frame-wrap');wrap.style.width=w+'px';wrap.style.height=h+'px';
      var f=document.createElement('iframe');f.src=v.src;f.title=v.name;f.style.transform='scale('+s+')';
      f.addEventListener('load',function(){
        try{var win=f.contentWindow;if(win.setSheetEntry) win.setSheetEntry(v.entry!==false);}catch(e){}
      });
      wrap.appendChild(f);stage.appendChild(wrap);return stage;
    }
    var host=el('div','host');var root=host.attachShadow({mode:'open'});
    var st=document.createElement('style');st.textContent=CSS[v.key]+EXTRA;root.appendChild(st);
    var w2=el('div','sp',v.html);root.appendChild(w2);
    stage.appendChild(host);shadows.push(root);
    return stage;
  }

  /* ---------- 页面 ---------- */
  var nav=$('#nav'),groups=$('#groups');
  DATA.groups.forEach(function(g){
    var id=g[0],comps=DATA.components.filter(function(c){return c.group===id;});
    var sec=el('section','group');sec.id=id;
    sec.appendChild(el('header',null,'<h2>'+g[1]+'</h2><p>'+g[2]+'</p>'));
    var a=el('a','grp',g[1]);a.href='#'+id;a.dataset.t=id;nav.appendChild(a);
    if(id==='foundation'){sec.appendChild(foundation());}
    comps.forEach(function(c){
      var ca=el('a',null,c.name+'<small>'+c.variants.length+'</small>');ca.href='#'+c.id;ca.dataset.t=c.id;
      ca.style.display='none';ca.className='sub';nav.appendChild(ca);
      var cs=el('article','comp');cs.id=c.id;
      var h=el('div','comp-head','<h3>'+c.name+'</h3><code>'+c.en+'</code>');cs.appendChild(h);
      cs.appendChild(el('div','meta','<span><b>尺寸</b> '+c.size+'</span>'+(c.node?'<span><b>Figma</b> '+c.node+'</span>':'')+'<span><b>变体</b> '+c.variants.length+'</span>'));
      cs.appendChild(el('p','comp-desc',c.desc));
      var dl=el('dl','props');c.props.forEach(function(p){dl.appendChild(el('dt',null,p[0]));dl.appendChild(el('dd',null,p[1]));});cs.appendChild(dl);
      var vars=el('div','vars');vars.style.setProperty('--min',c.min+'px');
      c.variants.forEach(function(v){
        var card=el('div','var'+(v.wide?' wide':''));
        card.appendChild(specimen(v));
        card.appendChild(el('div','cap','<b>'+v.name+'</b>'+(v.note?'<p>'+v.note+'</p>':'')));
        vars.appendChild(card);
      });
      cs.appendChild(vars);sec.appendChild(cs);
    });
    groups.appendChild(sec);
  });
  /* 目录：桌面端把组件名缩进显示在对应分组下 */
  [].forEach.call(nav.querySelectorAll('a.sub'),function(a){a.style.display='';a.style.paddingLeft='22px';a.style.fontSize='13px';});
  var mq=window.matchMedia('(min-width:960px)');
  function syncNav(){[].forEach.call(nav.querySelectorAll('a.sub'),function(a){a.style.display=mq.matches?'':'none';});}
  syncNav();mq.addEventListener?mq.addEventListener('change',syncNav):mq.addListener(syncNav);

  /* 滚动时高亮目录 */
  var links=[].slice.call(nav.querySelectorAll('a'));
  var targets=links.map(function(a){return document.getElementById(a.dataset.t);});
  function spy(){
    var y=window.scrollY+120,cur=0;
    targets.forEach(function(t,i){if(t&&t.offsetTop<=y) cur=i;});
    links.forEach(function(a,i){a.setAttribute('aria-current',i===cur?'true':'false');});
  }
  window.addEventListener('scroll',spy,{passive:true});spy();

  /* 控件 */
  function seg(id,fn){
    var s=$(id);s.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b) return;
      [].forEach.call(s.children,function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});fn(b.dataset.v);
      try{localStorage.setItem(id,b.dataset.v);}catch(_){}
    });
    var saved=null;try{saved=localStorage.getItem(id);}catch(_){}
    if(saved){var b=s.querySelector('[data-v="'+saved+'"]');if(b) b.click();}
  }
  seg('#stageSeg',function(v){
    document.documentElement.style.setProperty('--g-stage',v==='white'?'#ffffff':v==='dark'?'#2a2527':'#fff5eb');
  });
  seg('#themeSeg',function(v){
    if(v==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v);
  });

  /* 字体就绪后摆高光 */
  function hl(){shadows.forEach(placeHL);}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(hl);
  window.addEventListener('load',function(){hl();setTimeout(hl,400);});
})();
</script>
</body>
</html>
