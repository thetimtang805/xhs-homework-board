<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="作业榜">
<link rel="apple-touch-icon" href="assets/pwa/icon-180.png">
<link rel="icon" type="image/png" href="assets/pwa/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>作业榜 · 完整流程</title>
<style>
/* 流程外壳：视频播放页 → 评论浮层（75%）→ 作业榜（列表 ⇄ 大图）。
   三个页面各自放在 iframe 里，外壳只负责转场和消息转发：
   video:comment → 开评论浮层；sheet:entry → 进作业榜；sheet:close → 关浮层；homework:back → 回到浮层 */
:root{--ease:cubic-bezier(.32,.72,0,1);--stage:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* 手机框固定 375×812，按屏幕等比缩放后居中（缩放比例由脚本算好写进 --s，手机上不再留空白也不会被地址栏遮住） */
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;background:var(--stage);display:flex;align-items:center;justify-content:center;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.phone{position:relative;flex:none;width:375px;height:812px;overflow:hidden;background:#000;transform:translateY(var(--ty,0px)) scale(var(--s,1));transform-origin:center center}
.phone iframe{position:absolute;border:0;background:transparent;display:block}
#video{inset:0;width:100%;height:100%}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .24s ease-out}
#dim.on{opacity:.42;pointer-events:auto;transition-duration:.32s}
/* 评论浮层：占屏幕下方 75%，iframe 只盖这一块，上面 25% 的点击落到遮罩 */
#sheet{left:0;bottom:0;width:100%;height:75%;pointer-events:none}
#sheet.on{pointer-events:auto}
/* 作业榜：从右侧推入，下面的页面略微左移 */
#board{inset:0;width:100%;height:100%;transform:translateX(100%);transition:transform .29s var(--ease);box-shadow:-10px 0 28px rgba(0,0,0,.28);visibility:hidden}
.phone.board-on #board{transform:none;visibility:visible;transition-duration:.38s}
#board.leaving{visibility:visible}
#video,#sheet,#dim{transition:transform .29s var(--ease),opacity .24s ease-out}
.phone.board-on #video,.phone.board-on #sheet,.phone.board-on #dim{transform:translateX(-22%);transition-duration:.38s,.32s}
@media (prefers-reduced-motion:reduce){#board,#video,#sheet,#dim{transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <iframe id="video" src="video-page.html" title="视频播放页"></iframe>
  <div id="dim"></div>
  <iframe id="sheet" src="comment-page.html?embed=1" title="评论"></iframe>
  <iframe id="board" src="homework-board.html" title="美食作业榜"></iframe>
</div>
<script>
(function(){
  /* 等比缩放到可见区域：手机上铺满（不放大超过屏幕），桌面上最多 1 倍 */
  function fit(){
    var w=window.innerWidth,h=window.innerHeight,s=Math.min(w/375,h/812),ty=0;
    if(w>600) s=Math.min(s,1);
    /* 主屏幕全屏：尽量按宽度铺满，两边不留黑边。设计稿顶部 47px 是被隐藏的假状态栏、底部约 20px 是假 Home 横条，
       屏幕高度不够时先裁这两块（顶部先裁），仍不够再整体略微缩小；裁得最多 67px。 */
    if(standalone&&w<=600){
      var sc=Math.min(w/375,h/745),crop=812-h/sc;
      s=sc;
      if(crop>0){var top=Math.min(47,crop);ty=-top*sc+crop*sc/2;}
    }
    document.documentElement.style.setProperty('--s',String(s));
    document.documentElement.style.setProperty('--ty',ty+'px');
  }
  /* 从主屏幕全屏打开时，真机自带刘海、状态栏和 Home 横条，页面里画的假状态栏/刘海/横条要藏起来，否则会叠在一起（?standalone 可在浏览器里预览这个状态） */
  var standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||/[?&]standalone\b/.test(location.search);
  if(standalone){
    ['video','sheet','board'].forEach(function(id){
      var f=document.getElementById(id);
      function hideFake(){
        try{var d=f.contentDocument;if(!d||!d.head||d.getElementById('no-fake-chrome')) return;
          var st=d.createElement('style');st.id='no-fake-chrome';st.textContent='.status,.home,.home2{display:none!important}';d.head.appendChild(st);}catch(e){}
      }
      f.addEventListener('load',hideFake);hideFake();
    });
  }
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);
})();
(function(){
  var phone=document.getElementById('phone'),dim=document.getElementById('dim');
  var sheet=document.getElementById('sheet'),board=document.getElementById('board');
  var sheetOpen=false,boardOn=false,closeTimer=0;
  function post(frame,msg){try{frame.contentWindow.postMessage(msg,'*');}catch(e){}}

  function openSheet(){
    if(sheetOpen) return;
    sheetOpen=true;clearTimeout(closeTimer);
    sheet.classList.add('on');dim.classList.add('on');
    post(sheet,{cmd:'open'});
  }
  function closeSheet(){
    if(!sheetOpen) return;
    sheetOpen=false;
    dim.classList.remove('on');
    post(sheet,{cmd:'close'});
    closeTimer=setTimeout(function(){sheet.classList.remove('on');},260);
  }
  function openBoard(){
    if(boardOn) return;
    boardOn=true;
    post(board,{cmd:'reset'});
    phone.classList.add('board-on');
  }
  function closeBoard(){
    if(!boardOn) return;
    boardOn=false;
    board.classList.add('leaving');
    phone.classList.remove('board-on');
    setTimeout(function(){board.classList.remove('leaving');},330);
  }
  dim.addEventListener('click',closeSheet);

  window.addEventListener('message',function(e){
    var d=e.data;if(!d||!d.type) return;
    if(d.type==='video:comment') openSheet();
    else if(d.type==='sheet:entry') openBoard();
    else if(d.type==='sheet:close') closeSheet();
    else if(d.type==='homework:back') closeBoard();
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(boardOn) post(board,{cmd:'escape'}); else closeSheet();
  });
  /* 供外部或调试使用 */
  window.flow={openSheet:openSheet,closeSheet:closeSheet,openBoard:openBoard,closeBoard:closeBoard};
})();
</script>
</body>
</html>
