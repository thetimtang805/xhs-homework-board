<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作业大图页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
/* tokens：取自 Figma 文件 rednote-ds 的变量定义（node 36:3181） */
:root{
  --color-text-primary:#1f1f1f;
  --color-text-secondary:#8a8a8a;
  --color-text-accent:#ff2442;
  --color-text-inverse:#ffffff;
  --color-icon-accent:#ff2442;
  --color-icon-secondary:#8a8a8a;
  --color-border-subtle:#f5f5f5;
  --color-bg-inverse:#1f1f1f;
  --color-bg-brand-soft:#fff2f4;
  --color-status-warning-text:#ad6800;
  --color-status-warning-icon:#ad6800;
  --color-status-danger-text:#b01129;
  --color-status-danger-icon:#b01129;
  --space-2xs:4px;--space-xs:6px;--space-sm:8px;--space-lg:12px;--space-xl:16px;--space-2xl:24px;
  --radius-component:8px;--radius-container:16px;--radius-pill:999px;
  --body-sm-font-size:14px;--body-sm-line-height:20px;--body-sm-letter-spacing:0px;
  --font-zh:"Noto Sans SC","PingFang SC",sans-serif;
  --font-en:"SF Pro",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --font-status:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --stage:#2a2a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{-webkit-font-smoothing:antialiased;background:var(--stage);display:flex;align-items:center;justify-content:center;font-family:var(--font-zh)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:none}
p{font-weight:400}
.zh{font-family:var(--font-zh)}.en{font-family:var(--font-en)}
.fill{position:absolute;inset:0;width:100%;height:100%}

/* ===== 页面模板 page-detail：渐变背景、顶部渐变条、彩带、状态栏、home 条 ===== */
.page{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(to bottom,#fff5eb 64.594%,#fff)}
@media (max-width:375px){body{display:block}.page{width:100vw;height:100dvh}}
.band{position:absolute;top:0;left:50%;transform:translateX(-50%);width:375px;height:160px;background:linear-gradient(179.871deg,rgb(254,202,206) .262%,rgb(254,223,220) 64.921%,rgba(255,245,235,0) 99.738%)}
.confetti{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.confetti .in{flex:none}
.confetti img{position:relative;display:block;width:100%;height:100%;object-fit:cover;opacity:.2}
.c1{left:-14px;top:-13px;width:89px;height:89px}.c1 .in{width:89px;height:89px;transform:rotate(180deg)}
.c2{left:320px;top:36px;width:73px;height:73px;z-index:4}.c2 .in{width:73px;height:73px;transform:rotate(180deg) scale(1,-1)}
.status{position:absolute;top:0;left:50%;transform:translateX(-50%);width:375px;height:47px;overflow:hidden;z-index:4}
.status .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:172px;height:32px}
.status .time{position:absolute;top:14px;left:calc(16.67% - 10.5px);transform:translateX(-50%);width:54px;height:21px;border-radius:24px}
.status .time p{position:absolute;top:1px;left:27px;transform:translateX(-50%);width:54px;height:20px;text-align:center;font-family:var(--font-status);font-weight:600;font-size:16px;line-height:21px;letter-spacing:-.32px;color:#000;white-space:nowrap}
.status .right{position:absolute;top:19px;left:calc(83.33% - .3px);transform:translateX(-50%);width:77.401px;height:13px}
.home{position:absolute;left:50%;transform:translateX(-50%);top:799px;width:134px;height:5px;border-radius:var(--radius-pill);background:var(--color-bg-inverse);pointer-events:none;z-index:6}

/* ===== 内容区：状态栏下方，纵向排列（筛选 → 轮播 → 名字条），内容超出时可滚动 ===== */
.main{position:absolute;left:0;right:0;top:47px;bottom:0;z-index:2;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;align-items:flex-start;padding-bottom:calc(28px + 43px + var(--space-xl))}
.main::-webkit-scrollbar{display:none}

/* ---- filter：返回箭头 + 流派 chip，选中态在箭头显示时出现刷新 ---- */
.hf{display:flex;align-items:center;width:100%;height:65px;flex:none;position:sticky;top:0;z-index:5}
.hf .chips{display:flex;align-items:center;gap:var(--space-sm);flex:1;min-width:0;height:100%;padding-right:var(--space-xl);overflow-x:auto;scrollbar-width:none;scroll-padding-inline:var(--space-xl)}
.hf[data-back="hidden"] .chips{padding-left:var(--space-xl)}
.hf .chips::-webkit-scrollbar{display:none}
.hf .chips::after{content:"";flex:none;width:1px}
.hf .back{position:relative;flex:none;width:22px;height:22px;padding:0;margin:0 var(--space-sm) 0 var(--space-xl)}
.hf .back img{position:absolute;inset:0;width:100%;height:100%;display:block}
.hf .back::before{content:"";position:absolute;inset:-11px -7px -11px -16px}
.hf .back:focus-visible{outline:2px solid var(--color-status-warning-icon);outline-offset:2px;border-radius:4px}
.hf[data-back="hidden"] .back{display:none}
.chip{position:relative;flex:none;display:flex;align-items:center;justify-content:center;gap:4px;height:33px;padding:calc(var(--space-xs) + .5px) calc(var(--space-xl) + .5px);border-radius:var(--radius-pill);box-shadow:inset 0 0 0 .5px var(--bc);color:var(--tc);font-size:var(--body-sm-font-size);line-height:var(--body-sm-line-height);letter-spacing:var(--body-sm-letter-spacing);white-space:nowrap;transition:background .2s,color .2s}
.chip{background:var(--bg,none)}
.chip.on{background:var(--fill);color:var(--color-text-inverse)}
.chip .lbl{display:flex;align-items:center;gap:4px;font:inherit;color:inherit;white-space:nowrap}
.chip .lbl p{font-size:inherit;line-height:inherit;letter-spacing:inherit}
.chip .lbl::before{content:"";position:absolute;inset:-5.5px 0}
.chip .lbl:focus-visible{outline:none}
.chip:has(.lbl:focus-visible){outline:2px solid var(--color-icon-accent);outline-offset:2px}
.chip.all{--bc:#c2790c;--tc:var(--color-status-warning-text);--fill:var(--color-status-warning-text);padding-inline:calc(var(--space-2xl) + .5px)}
.chip.chili{--bg:color-mix(in srgb,var(--color-bg-brand-soft) 85%,transparent);--bc:var(--color-icon-accent);--tc:var(--color-text-accent);--fill:var(--color-text-accent)}
.chip.salt{--bg:rgba(255,255,255,.85);--bc:var(--color-icon-secondary);--tc:var(--color-text-primary);--fill:var(--color-text-primary)}
.chip.deluxe{--bg:color-mix(in srgb,var(--color-bg-brand-soft) 85%,transparent);--bc:var(--color-status-danger-icon);--tc:var(--color-status-danger-text);--fill:var(--color-status-danger-text)}
.chip.fusion{--bg:rgba(255,247,230,.85);--bc:#ad0000;--tc:var(--color-status-warning-text);--fill:linear-gradient(to left,var(--color-status-warning-text),#ad0000)}
.chip .em{position:relative;flex:none}
.chip .em .clip{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.chip .em .clip img{position:absolute;max-width:none}
.chip .em .sel{display:none;position:absolute;inset:0;width:100%;height:100%;object-position:bottom;pointer-events:none}
.chip.on .em.has-sel .sel{display:block}
.chip.on .em.has-sel .clip{display:none}
.chip.fusion .t{display:flex;align-items:center;gap:4px}
.chip.fusion .grad{background:linear-gradient(to left,var(--color-status-warning-text),#ad0000);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.chip.fusion .en{color:inherit}
.chip.fusion.on .grad{background:none;color:var(--color-text-inverse);-webkit-text-fill-color:var(--color-text-inverse)}
.chip .rf{display:none;position:relative;z-index:1;flex:none;width:16px;height:16px;padding:0}
.chip .rf::before{content:"";position:absolute;inset:-9px}
.chip .rf:focus-visible{outline:2px solid var(--color-text-inverse);outline-offset:2px;border-radius:4px}
.chip .rf .rg{position:absolute;inset:0;overflow:hidden}
.chip .rf .rg .gp{position:absolute;inset:12.5% 16.42% 12.5% 16.67%}
.chip .rf .rg .gp i{position:absolute;inset:-5.56% -6.23%}
.chip .rf .rg .gp img{display:block;width:100%;height:100%}
.hf[data-back="show"] .chip.on .rf{display:block}

/* ---- pic-carousel 343×497 ---- */
.pc{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-lg);width:343px;max-width:calc(100% - 32px);margin:23px 0 0 var(--space-xl);flex:none}
.pc .frame{position:relative;flex:none;width:100%;aspect-ratio:343/461;border:3px solid var(--color-border-subtle);border-radius:var(--radius-container);box-shadow:0 4px 20px 0 rgba(135,67,15,.15)}
.pc .track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--radius-container)}
.pc .track::-webkit-scrollbar{display:none}
.pc .track img{flex:none;width:100%;height:100%;object-fit:cover;border-radius:var(--radius-container);scroll-snap-align:start;scroll-snap-stop:always;-webkit-user-drag:none}
.pc .dots{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:var(--space-sm) 0;flex:none}
.pc .dot{position:relative;flex:none;width:8px;height:8px;padding:0}
.pc .dot::before{content:"";position:absolute;inset:-8px -3px}
.pc .dot img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pc .dot .on{display:none}
.pc .dot[aria-current="true"] .on{display:block}
.pc .dot[aria-current="true"] .off{display:none}
.pc .dot:focus-visible{outline:2px solid var(--color-icon-accent);outline-offset:3px;border-radius:50%}

/* ---- name-tag 343×59 ---- */
.ntag{display:flex;align-items:center;justify-content:space-between;width:343px;max-width:calc(100% - 32px);margin:18px 0 0 var(--space-xl);padding:var(--space-lg) var(--space-xl);border-radius:var(--radius-container);background:#fdeede;flex:none}
.ntag .nl{display:flex;align-items:center;gap:var(--space-sm);flex:none}
.ntag .av{position:relative;flex:none;width:35px;height:35px}
.ntag .av img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}
.ntag .nm{font-size:var(--body-sm-font-size);line-height:var(--body-sm-line-height);letter-spacing:var(--body-sm-letter-spacing);color:var(--color-text-secondary);white-space:nowrap}
.ntag .nr{display:flex;align-items:center;gap:var(--space-2xl);flex:none}
.ntag .ni{display:flex;align-items:center;gap:2px;flex:none}
.ntag .ic{position:relative;flex:none;width:18px;height:18px}
.ntag .ic img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ntag .ni span{font-variant-numeric:tabular-nums;font-size:var(--body-sm-font-size);line-height:var(--body-sm-line-height);letter-spacing:var(--body-sm-letter-spacing);color:var(--color-text-secondary);white-space:nowrap}

/* ---- button「我也交作业」191×43：底部居中悬浮 ---- */
.fab{position:absolute;left:calc(50% - 95.5px);bottom:28px;width:191px;height:43px;padding:0;border-radius:var(--radius-pill);background:#ff3e42;z-index:3}
.fab .label{position:absolute;left:calc(50% + 20.5px);top:11px;width:102px;height:21px;transform:translateX(-50%);pointer-events:none}
.fab .label img{position:absolute;inset:0;width:100%;height:100%;object-position:bottom;pointer-events:none}
.fab .pan{position:absolute;left:19px;top:-9px;width:52px;height:52px;pointer-events:none}
.fab .pan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fab .inset{/* 内阴影在背景之上、图标和文字之下 */position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 -4px 4px 0 rgba(191,19,23,.35),inset 0 4px 4px 0 rgba(255,245,235,.3)}
.fab:focus-visible{outline:2px solid var(--color-text-primary);outline-offset:3px}
.fab:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.chip{transition:none}.fab:active{transform:none}}
</style>
</head>
<body>
<div class="page" id="page">

  <!-- 页面模板：背景与固定层 -->
  <div class="band"></div>
  <div class="confetti c1"><div class="in"><img src="assets/page/header-confetti-1.png" alt=""></div></div>
  <div class="confetti c2"><div class="in"><img src="assets/page/header-confetti-2.png" alt=""></div></div>
  <div class="status" aria-hidden="true">
    <div class="notch"><img class="fill" src="assets/page/statusbar-notch.svg" alt=""></div>
    <div class="time"><p>9:41</p></div>
    <div class="right"><img class="fill" src="assets/page/statusbar-right.svg" alt=""></div>
  </div>

  <main class="main" id="main">

    <!-- filter -->
    <div class="hf" id="hf" data-back="show" role="tablist" aria-label="流派筛选">
      <button class="back" id="back" aria-label="返回"><img src="assets/page/header-back.svg" alt=""></button>

      <div class="chips" id="chips">
      <div class="chip all">
        <button class="lbl" role="tab" aria-selected="false"><p class="zh">全部</p></button>
        <button class="rf" aria-label="刷新"><span class="rg"><span class="gp"><i><img src="assets/components/filter-refresh.svg" alt=""></i></span></span></button>
      </div>

      <div class="chip chili on">
        <button class="lbl" role="tab" aria-selected="true">
          <span class="em has-sel" style="width:19px;height:19px">
            <span class="clip"><img src="assets/components/filter-chili.png" alt="" style="left:-31.58%;top:-23.68%;width:147.37%;height:147.37%"></span>
            <img class="sel" src="assets/components/filter-chili-selected.png" alt="">
          </span>
          <p class="zh">川渝麻辣版</p>
        </button>
        <button class="rf" aria-label="刷新"><span class="rg"><span class="gp"><i><img src="assets/components/filter-refresh.svg" alt=""></i></span></span></button>
      </div>

      <div class="chip salt">
        <button class="lbl" role="tab" aria-selected="false">
          <span class="em" style="width:17.434px;height:22.228px"><span class="clip"><img src="assets/components/filter-salt.png" alt="" style="left:-33.33%;top:-15.36%;width:155.56%;height:122.01%"></span></span>
          <p class="zh">极简原料</p>
        </button>
        <button class="rf" aria-label="刷新"><span class="rg"><span class="gp"><i><img src="assets/components/filter-refresh.svg" alt=""></i></span></span></button>
      </div>

      <div class="chip deluxe">
        <button class="lbl" role="tab" aria-selected="false">
          <span class="em" style="width:25.099px;height:19px"><span class="clip"><img src="assets/components/filter-deluxe.png" alt="" style="left:-8.05%;top:-23.68%;width:111.56%;height:147.37%"></span></span>
          <p class="zh">加料豪华版</p>
        </button>
        <button class="rf" aria-label="刷新"><span class="rg"><span class="gp"><i><img src="assets/components/filter-refresh.svg" alt=""></i></span></span></button>
      </div>

      <div class="chip fusion">
        <button class="lbl" role="tab" aria-selected="false">
          <span class="em" style="width:22.047px;height:19px"><span class="clip"><img src="assets/components/filter-fusion.png" alt="" style="left:0;top:-12.53%;width:104.98%;height:121.82%"></span></span>
          <span class="t"><p class="grad zh">中西</p><p class="en">Fusion</p></span>
        </button>
        <button class="rf" aria-label="刷新"><span class="rg"><span class="gp"><i><img src="assets/components/filter-refresh.svg" alt=""></i></span></span></button>
      </div>
      </div>
    </div>

    <!-- pic-carousel -->
    <section class="pc" id="pc" data-active="0" aria-label="作业大图">
      <div class="frame"><div class="track" id="track"><img src="assets/components/gallery-1.jpg" alt="" draggable="false"><img src="assets/components/gallery-2.jpg" alt="" draggable="false"><img src="assets/components/gallery-3.jpg" alt="" draggable="false"></div></div>
      <div class="dots" role="tablist" aria-label="图片">
        <button class="dot" role="tab" aria-label="第 1 张" aria-current="true"><img class="off" src="assets/components/carousel-dot-off.svg" alt=""><img class="on" src="assets/components/carousel-dot-on.svg" alt=""></button>
        <button class="dot" role="tab" aria-label="第 2 张"><img class="off" src="assets/components/carousel-dot-off.svg" alt=""><img class="on" src="assets/components/carousel-dot-on.svg" alt=""></button>
        <button class="dot" role="tab" aria-label="第 3 张"><img class="off" src="assets/components/carousel-dot-off.svg" alt=""><img class="on" src="assets/components/carousel-dot-on.svg" alt=""></button>
      </div>
    </section>

    <!-- name-tag -->
    <div class="ntag">
      <div class="nl">
        <div class="av"><img src="assets/before/avatar-1.png" alt="" width="35" height="35"></div>
        <p class="nm zh">辣妹子很怕拉</p>
      </div>
      <div class="nr">
        <div class="ni"><div class="ic"><img src="assets/before/icon-heart.svg" alt=""></div><span class="en">129</span></div>
        <div class="ni"><div class="ic"><img src="assets/components/nametag-comment.svg" alt=""></div><span class="en">24</span></div>
      </div>
    </div>

  </main>

  <!-- button -->
  <button class="fab" id="fab" aria-label="我也交作业">
    <span class="inset"></span>
    <span class="label"><img src="assets/components/button-label.png" alt=""></span>
    <span class="pan"><img src="assets/components/button-icon.png" alt=""></span>
  </button>

  <div class="home"></div>
</div>

<script>
/* 筛选：点击切换流派（设计稿只给出「川渝麻辣版」的选中样式，其余沿用同一规则）；
   选中的 chip 在返回箭头显示时出现刷新。
   setFilterBack(true|false) 控制返回箭头（隐藏时刷新一并消失）；
   事件：homework:back / homework:join / filter:refresh / filter:change / carousel:change */
var hf=document.getElementById('hf');
var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function setFilterBack(show){ hf.setAttribute('data-back',show?'show':'hidden'); }
/* 轮播：横向 scroll-snap，圆点与滑动互相同步；setCarouselIndex(i) 滑到第 i 张 */
var carouselIndex=0, carouselLock=0;
function markDots(i){
  var dots=document.querySelectorAll('#pc .dot');
  for(var k=0;k<dots.length;k++){ if(k===i) dots[k].setAttribute('aria-current','true'); else dots[k].removeAttribute('aria-current'); }
  document.getElementById('pc').setAttribute('data-active',i);
}
function setCarouselIndex(i,notify){
  var track=document.getElementById('track'),n=track.children.length;
  if(i<0||i>=n) return;
  carouselLock=Date.now()+(reduceMotion.matches?60:500);
  track.scrollTo({left:i*track.clientWidth,behavior:reduceMotion.matches?'auto':'smooth'});
  if(i!==carouselIndex){ carouselIndex=i; markDots(i); if(notify!==false) document.getElementById('page').dispatchEvent(new CustomEvent('carousel:change',{bubbles:true,detail:{index:i}})); }
}
(function(){
  var page=document.getElementById('page');
  var chips=[].slice.call(hf.querySelectorAll('.chip'));
  chips.forEach(function(c,idx){
    c.querySelector('.lbl').addEventListener('click',function(){
      chips.forEach(function(x){ var on=(x===c); x.classList.toggle('on',on); x.querySelector('.lbl').setAttribute('aria-selected',on?'true':'false'); });
      c.scrollIntoView({inline:'nearest',block:'nearest',behavior:reduceMotion.matches?'auto':'smooth'});
      page.dispatchEvent(new CustomEvent('filter:change',{bubbles:true,detail:{index:idx}}));
    });
    c.querySelector('.rf').addEventListener('click',function(){
      page.dispatchEvent(new CustomEvent('filter:refresh',{bubbles:true,detail:{index:idx}}));
    });
  });
  document.getElementById('back').addEventListener('click',function(){ page.dispatchEvent(new CustomEvent('homework:back',{bubbles:true})); });
  document.getElementById('fab').addEventListener('click',function(){ page.dispatchEvent(new CustomEvent('homework:join',{bubbles:true})); });
  var dots=document.querySelectorAll('#pc .dot');
  for(var k=0;k<dots.length;k++){ (function(i){ dots[i].addEventListener('click',function(){ setCarouselIndex(i); }); })(k); }
  /* 手指滑动：滚动停在哪张，圆点就跟到哪张（点击圆点触发的滚动期间不重复通知） */
  var track=document.getElementById('track');
  track.addEventListener('scroll',function(){
    if(Date.now()<carouselLock) return;
    var i=Math.round(track.scrollLeft/track.clientWidth);
    if(i!==carouselIndex){ carouselIndex=i; markDots(i); page.dispatchEvent(new CustomEvent('carousel:change',{bubbles:true,detail:{index:i}})); }
  },{passive:true});
})();
</script>
</body>
</html>
